<script id="lesson-data" type="application/json">{"id": "deadlock-v2", "title": "Deadlocks, without the guesswork", "reviewed": true, "mode": "Reviewed offline sample", "pages": [{"page": 1, "text": "A deadlock is a state in which a set of threads cannot proceed because each waits for a resource held by another in the set. Four necessary conditions are mutual exclusion, hold-and-wait, no preemption and circular wait. Removing any one condition prevents this kind of deadlock."}, {"page": 2, "text": "Suppose there is exactly one instance of each resource. Thread A holds lock X and requests Y. Thread B holds Y and requests X. Neither releases its held lock until it obtains the other. Both remain blocked. A cycle does not always imply deadlock when a resource has multiple instances."}, {"page": 3, "text": "Deadlock prevention disallows at least one necessary condition by design. For example, all threads acquire X before Y, preventing a circular wait between these two locks. Avoidance instead examines proposed allocations and grants only those that preserve a safe completion sequence. Prevention and avoidance are different strategies."}], "concepts": [{"id": "conditions", "title": "The four conditions", "page": 1, "quote": "A deadlock is a state in which a set of threads cannot proceed because each waits for a resource held by another in the set. Four necessary conditions are mutual exclusion, hold-and-wait, no preemption and circular wait. Removing any one condition prevents this kind of deadlock.", "plain": "Imagine two people each holding one key and waiting for the other key. A deadlock needs exclusive resources, holding while waiting, no forced taking-away, and a waiting loop. Remove one ingredient and this deadlock cannot form.", "example": "If a thread must obtain all required locks together, it cannot hold one lock while waiting for another: hold-and-wait is removed."}, {"id": "cycle", "title": "Spot the waiting loop", "page": 2, "quote": "Suppose there is exactly one instance of each resource. Thread A holds lock X and requests Y. Thread B holds Y and requests X. Neither releases its held lock until it obtains the other. Both remain blocked. A cycle does not always imply deadlock when a resource has multiple instances.", "plain": "Follow who is waiting for whom. A waits for B, and B waits for A. In our examples every lock has one instance and a blocked thread does not release its lock. Both wait forever unless something outside changes the state.", "example": "A holds X -> waits for Y held by B -> B waits for X held by A. The arrow loop is the evidence. With multiple interchangeable instances, a cycle alone is not enough."}, {"id": "strategy", "title": "Prevent or avoid?", "page": 3, "quote": "Deadlock prevention disallows at least one necessary condition by design. For example, all threads acquire X before Y, preventing a circular wait between these two locks. Avoidance instead examines proposed allocations and grants only those that preserve a safe completion sequence. Prevention and avoidance are different strategies.", "plain": "Prevention changes the rules so a necessary ingredient cannot happen. Avoidance checks a particular allocation before allowing it, making sure all threads could still finish in some order.", "example": "Always take X before Y = prevention. Simulate an allocation and check a safe finishing order = avoidance."}], "pre": [{"id": "pre1", "concept": "conditions", "page": 1, "prompt": "A thread holds a printer while waiting for a scanner. Which condition is illustrated?", "options": ["No preemption", "Hold-and-wait", "Circular wait"], "correct": 1, "why": "It keeps one resource while waiting for another."}, {"id": "pre2", "concept": "conditions", "page": 1, "prompt": "Which change rules out one necessary deadlock condition?", "options": ["Require all needed locks to be obtained together", "Give threads longer names", "Increase the waiting timeout without releasing locks"], "correct": 0, "why": "Obtaining all locks together removes hold-and-wait."}, {"id": "pre3", "concept": "cycle", "page": 2, "prompt": "One instance each: A holds X and waits for Y; B holds Y and waits for X. Neither releases while blocked. What follows?", "options": ["A can finish immediately", "Both are deadlocked", "There is not enough information because the locks have names"], "correct": 1, "why": "The two held locks and circular waiting leave neither thread able to proceed."}, {"id": "pre4", "concept": "cycle", "page": 2, "prompt": "A waiting cycle with several interchangeable instances per resource proves deadlock. Is this always true?", "options": ["Yes", "No"], "correct": 1, "why": "With multiple instances, a cycle is not sufficient by itself."}, {"id": "pre5", "concept": "strategy", "page": 3, "prompt": "Every thread must acquire X before Y. This is:", "options": ["Prevention", "Avoidance via safe-state testing", "Neither"], "correct": 0, "why": "A fixed lock order prevents circular wait."}, {"id": "pre6", "concept": "strategy", "page": 3, "prompt": "Checking whether an allocation leaves a safe completion order is:", "options": ["Prevention by lock naming", "Avoidance", "Ignoring deadlock"], "correct": 1, "why": "Avoidance checks the safety of an allocation."}], "practice": [{"id": "practice1", "concept": "conditions", "page": 1, "prompt": "A lock can be forcibly reclaimed. Which necessary condition is broken?", "options": ["No preemption", "Hold-and-wait", "Circular wait"], "correct": 0, "why": "Forced reclamation breaks no preemption."}, {"id": "practice2", "concept": "cycle", "page": 2, "prompt": "Single-instance locks: E owns P and wants Q; F owns Q but needs nothing else. Is deadlock established?", "options": ["Yes", "No"], "correct": 1, "why": "F can finish and release Q, so there is no closed waiting loop."}, {"id": "practice3", "concept": "strategy", "page": 3, "prompt": "Why can a universal lock order help?", "options": ["It prevents a circular waiting order", "It makes every ance improves"], "correct": 0, "why": "Safe-state checking is avoidance, not a claim about performance."}], "references": [{"url": "https://pages.cs.wisc.edu/~remzi/OSFEP/threads-deadlock.pdf", "title": "OSTEP: Common Concurrency Problems", "note": "Reference for four necessary conditions and lock ordering. Sample prose and questions are original."}], "limitations": ["Original sample content, source-checked but not expert-reviewed.", "Six items per assessment; two per concept. Forms match a blueprint but are not statistically equated.", "Single-instance resource examples only. No claim of lasting mastery or causal learning benefit."], "version": "2.0.0", "recall": [{"id": "r1", "concept": "conditions", "page": 1, "prompt": "A task can have its resource forcibly taken away. Which necessary condition no longer holds?", "options": ["No preemption", "Circular wait", "Mutual exclusion"], "correct": 0, "why": "No preemption means resources cannot be forcibly taken. This system permits that."}, {"id": "r2", "concept": "conditions", "page": 1, "prompt": "A service can request another lock only after it releases every lock it owns. Which condition does this rule remove?", "options": ["Mutual exclusion", "Hold-and-wait", "No preemption"], "correct": 1, "why": "The service cannot hold one resource while waiting for another."}, {"id": "r3", "concept": "cycle", "page": 2, "prompt": "One copy each: T owns R, waits for S; U owns S, waits for R. Both keep their locks and requests block. What follows?", "options": ["Both can finish now", "They are deadlocked", "U owns both locks"], "correct": 1, "why": "The closed wait cycle leaves neither thread with a way to proceed."}, {"id": "r4", "concept": "cycle", "page": 2, "prompt": "T waits for a lock owned by U. U needs no further locks and can finish. Is a closed deadlock cycle established?", "options": ["Yes", "No"], "correct": 1, "why": "U can finish and release the lock, allowing T to continue. A wait is not by itself a cycle."}, {"id": "r5", "concept": "strategy", "page": 3, "prompt": "Every worker must use the same increasing lock order. What does this prevent?", "options": ["Circular wait", "All waiting", "All scheduling delays"], "correct": 0, "why": "A universal acquisition order prevents circular wait, not every wait or delay."}, {"id": "r6", "concept": "strategy", "page": 3, "prompt": "A scheduler tentatively allocates resources and searches for an order in which all tasks can finish. Which strategy is this?", "options": ["Recovery after a crash", "Avoidance", "Prevention by removing all resource sharing"], "correct": 1, "why": "Checking the safety of a proposed allocation is avoidance."}]}</script>
<script>(function(root){
'use strict';
function score(lesson,stage,answers,confidence={}){const qs=lesson[stage];if(!Array.isArray(qs))throw Error('Unknown assessment');const evidence=qs.map(q=>{const a=answers[q.id];if(!Number.isInteger(a)||a< -1||a>=q.options.length)throw Error('Every question needs a valid answer');return {id:q.id,concept:q.concept,page:q.page,prompt:q.prompt,choice:a,chosen:a===-1?'I do not know':q.options[a],correct:q.correct,expected:q.options[q.correct],right:a===q.correct,why:q.why,confidence:confidence[q.id]||'unspecified'};});return {right:evidence.filter(x=>x.right).length,total:evidence.length,evidence,concepts:Object.fromEntries(lesson.concepts.map(c=>[c.id,evidence.filter(q=>q.concept===c.id&&q.right).length]))};}
function delta(a,b){if(!a.total||!b.total)throw Error('Empty assessment');return 100*(b.right/b.total-a.right/a.total);}
function path(lesson,result){return [...lesson.concepts].sort((a,b)=>(result.concepts[a.id]||0)-(result.concepts[b.id]||0));}
function analyze(owners,waits){const ts=Object.keys(waits);const resources=Object.keys(owners);if(ts.length>8||resources.length>8)throw Error('State too large');if(resources.some(r=>owners[r]!==null&&!ts.includes(owners[r])))throw Error('Unknown owner');if(ts.some(t=>waits[t]!==null&&!resources.includes(waits[t])))throw Error('Unknown resource');const edges={};for(const t of ts)edges[t]=waits[t]===null?null:owners[waits[t]];
const done=new Set(),order=[];let changed=true;while(changed){changed=false;for(const t of ts){if(done.has(t))continue;if(edges[t]===null||done.has(edges[t])){done.add(t);order.push(t);changed=true;}}}
const cycles=[];const cycleKeys=new Set();for(const start of ts){let t=start;const chain=[];while(t!==null&&!chain.includes(t)){chain.push(t);t=edges[t];}if(t!==null){let c=chain.slice(chain.indexOf(t));const key=[...c].sort().join(',');if(!cycleKeys.has(key)){cycleKeys.add(key);cycles.push(c);}}}
return {edges,order,blocked:ts.filter(t=>!done.has(t)),cycles,cycleNodes:[...new Set(cycles.flat())]};}
function report(lesson,state){const before=score(lesson,'pre',state.answers.pre,state.confidence.pre);const after=score(lesson,'post',state.answers.post,state.confidence.post);return {format:'LearnProof evidence',schema:2,lessonId:lesson.id,lessonVersion:lesson.version,exportedAt:new Date().toISOString(),completedAt:state.completedAt,before,after,deltaPercentagePoints:delta(before,after),recall:state.recallCompletedAt?score(lesson,'recall',state.answers.recall,state.confidence.recall):null,recallCompletedAt:state.recallCompletedAt||null,limits:lesson.limitations,notice:'Self-reported local session. Editable, unproctored and not identity-verified. These scores do not prove retention, mastery or a causal learning benefit.'};}
function restore(lesson,file){if(!file||file.format!=='LearnProof evidence'||file.schema!==2||file.lessonId!==lesson.id||file.lessonVersion!==lesson.version)throw Error('This is not a compatible LearnProof v2 evidence report.');const answers={pre:{},post:{},practice:{},recall:{}},confidence={pre:{},post:{},practice:{},recall:{}};for(const stage of ['pre','post']){const r=file[stage==='pre'?'before':'after'];if(!r||!Array.isArray(r.evidence)||r.evidence.length!==lesson[stage].length)throw Error('Missing answer evidence');for(const q of lesson[stage]){const e=r.evidence.find(x=>x.id===q.id);if(!e)throw Error('Missing answer');answers[stage][q.id]=e.choice;confidence[stage][q.id]=['sure','unsure'].includes(e.confidence)?e.confidence:'unspecified';}score(lesson,stage,answers[stage],confidence[stage]);}const stamp=Date.parse(file.completedAt);if(!Number.isFinite(stamp)||stamp>Date.now()+60000)throw Error('Invalid completion date');return {answers,confidence,completedAt:new Date(stamp).toISOString(),imported:true};}
const api={score,delta,path,analyze,report,restore};if(typeof module!=='undefined')module.exports=api;root.LPCore=api;
})(typeof window==='undefined'?globalThis:window);
</script>

const stages=['Start','Diagnose','Learn','Practice','Fresh check','Evidence'];const defaultState=()=>({v:2,view:'home',stage:'pre',index:0,answers:{pre:{},practice:{},post:{},recall:{}},confidence:{pre:{},practice:{},post:{},recall:{}},completedAt:null,recallCompletedAt:null,remember:false,imported:false,done:[],read:[],lab:{owners:{X:'A',Y:'B',Z:null},waits:{A:'Y',B:'X',C:null}},labRevealed:false,labPrediction:null});let S=defaultState();
try{const saved=JSON.parse(sessionStorage.getItem('lp2')||localStorage.getItem('lp2')||'null');if(saved&&saved.v===2&&saved.answers&&saved.confidence){S={...S,...saved};for(const st of ['pre','post','practice','recall'])for(const q of L[st]){const a=S.answers[st]?.[q.id];if(a!==undefined&&(!Number.isInteger(a)||a< -1||a>=q.options.length))throw Error('Invalid saved choice');}}}catch(e){S=defaultState()}

function home(){return `<div class="hero"><div><p class="eyebrow">A STUDY SESSION WITH RECEIPTS</p><h1>Less guessing.<br>More understanding.</h1><p class="intro">Dense notes should not be the end of the story. Find the gap, work through the idea, and check it with a different question.</p><div class="actions"><button class="primary" data-action="start">${complete('pre')?'Start a new self-check':'Find my starting point'} →</button>${complete('pre')?'<button data-action="resume">Resume my session</button>':''}</div><p class="small muted">No account. No upload. Works offline once saved.<br>Your scores come from your answers, not from AI.</p></div><div><div class="illustration"><p class="eyebrow">TODAY / OPERATING SYSTEMS</p>${diagram()}<p class="small muted" style="text-align:center;margin:10px 0 0">Two threads. Two locks. A reason to look closer.</p></div><button class="text small" data-action="lab">Explore the waiting lab ↗</button></div></div><div class="numbers"><div><b>03</b><span>source-linked concepts</span></div><div><b>06 + 06</b><span>different before / after items</span></div><div><b>01</b><span>honest evidence trail</span></div></div><div class="lessonline"><div><span class="tag">Reviewed, original teaching material</span><h3>${esc(L.title)}</h3><p class="small muted">The four conditions, waiting cycles, and prevention vs avoidance. A focused lesson for university learners who get stuck on dense technical notes.</p></div><button data-action="sources">Inspect the source notes</button></div><div class="help-grid"><div><h3>A path, not another summary</h3><p class="small muted">Your diagnostic decides what to revise first. Practice gives explanations. A fresh check shows which concepts still need work.</p></div><div><h3>Evidence, not a promise</h3><p class="small muted">Separate questions, transparent scoring and source passages. No fabricated progress, mastery badge, or claim that this tool caused improvement.</p></div></div><details><summary>Keep a copy & choose what is saved</summary><div><label class="setting"><input type="checkbox" id="remember" ${S.remember?'checked':''}>Remember this session on this device. Otherwise progress lasts only in this tab.</label><p class="small muted">A shared device? Leave this off. Clear your session when finished. No answers are sent to a server by this learning room.</p><div class="actions"><button data-action="download-app">Save offline learning room ↓</button><button data-action="clear">Clear local session</button></div><label class="small" for="import">Restore a compatible evidence report (JSON, under 100 KB)</label><br><input id="import" class="file-input" type="file" accept="application/json,.json"></div></details>`}
function quiz(){const qs=L[S.stage],q=qs[S.index],a=S.answers[S.stage][q.id];const labels={pre:['01 / FIND YOUR START','What do you know already?'],practice:['03 / TRY IT OUT','Think it through.'],post:['04 / DIFFERENT QUESTIONS','What makes sense now?'],recall:['06 / RETURN & RETRIEVE','What can you recall later?']};const [label,title]=labels[S.stage];return `<div class="question"><p class="eyebrow">${label}</p><h1>${title}</h1><p class="small muted">${S.stage==='pre'?'There is no pass mark. "I do not know" helps make the path honest.':S.stage==='practice'?'Use your reasoning. Feedback follows after this short set.':S.stage==='recall'?'A third question set. The elapsed interval is self-reported from this device, not verified.':'No hints or answer feedback during this check. Source code contains keys; this is not proctored.'}</p><div class="progress" role="progressbar" aria-label="Questions reached" aria-valuemin="0" aria-valuemax="${qs.length}" aria-valuenow="${S.index+1}"><div style="width:${100*(S.index+1)/qs.length}%"></div></div><p class="eyebrow" style="color:var(--pink)">QUESTION ${String(S.index+1).padStart(2,'0')} / ${String(qs.length).padStart(2,'0')}</p><h2 id="qprompt">${esc(q.prompt)}</h2><fieldset class="options" aria-labelledby="qprompt">${q.options.map((x,i)=>option(i,x,a)).join('')}${option(-1,'I do not know',a)}</fieldset><fieldset class="confidence"><legend>How confident are you? (optional)</legend><label><input type="radio" name="confidence" value="sure" ${S.confidence[S.stage][q.id]==='sure'?'checked':''}> Sure of my reasoning</label><label><input type="radio" name="confidence" value="unsure" ${S.confidence[S.stage][q.id]==='unsure'?'checked':''}> Still unsure</label></fieldset><p id="error" class="error" role="alert"></p><div class="actions"><button data-action="previous" ${S.index===0?'disabled':''}>← Previous</button><button class="primary" data-action="next">${S.index<qs.length-1?'Continue →':S.stage==='pre'?'Build my learning path →':S.stage==='practice'?'Review my reasoning →':S.stage==='recall'?'See recall evidence →':'See my evidence →'}</button></div></div>`}

function report(){const a=result('pre'),b=result('post'),d=C.delta(a,b),sure=b.evidence.filter(q=>!q.right&&q.confidence==='sure'),elapsed=Math.max(0,Date.now()-Date.parse(S.completedAt)),day=86400000;return `<p class="eyebrow">05 / YOUR ANSWERS, NOT AN AI VERDICT</p><h1>See what changed.</h1><p class="intro">One small snapshot of your understanding. Every number below links back to an actual choice and its supporting source passage.</p>${S.imported?'<div class="note warn">Restored from an editable local report. Scores were recalculated from the choices, but identity, timestamps and independent work are not verified.</div>':''}<div class="scores"><div><p class="eyebrow">STARTING CHECK</p><strong>${a.right}<small> / ${a.total}</small></strong></div><div class="arrow" aria-hidden="true">→</div><div><p class="eyebrow">FRESH CHECK</p><strong>${b.right}<small> / ${b.total}</small></strong></div></div><p class="delta">${d>=0?'+':''}${d.toFixed(1)} percentage points</p><p class="small muted">Observed score change on these items. The two forms are not statistically equated. This does not prove lasting mastery or that LearnProof caused a change.</p><div class="rule"></div><h2>What still needs a look?</h2>${L.concepts.map(c=>`<div class="concept-result"><div><h3>${esc(c.title)}</h3><p class="small muted">${b.concepts[c.id]<2?'Next: re-read page '+c.page+' and explain the worked example without looking.':'Both fresh items correct. Try explaining the idea in a different setting.'}</p></div><div class="small"><b>${a.concepts[c.id]} / 2 → ${b.concepts[c.id]} / 2</b><div class="bar" aria-label="${b.concepts[c.id]} of 2 fresh items correct"><span class="${b.concepts[c.id]>0?'on':''}"></span><span class="${b.concepts[c.id]>1?'on':''}"></span></div><span class="muted">Source page ${c.page}</span></div></div>`).join('')}${sure.length?`<div class="note warn"><b>Confidence worth revisiting</b><br>${sure.length} incorrect fresh-check answer${sure.length===1?' was':'s were'} marked "sure" const presets={cycle:{owners:{X:'A',Y:'B',Z:null},waits:{A:'Y',B:'X',C:null}},chain:{owners:{X:'A',Y:'B',Z:null},waits:{A:'Y',B:null,C:'X'}},three:{owners:{X:'A',Y:'B',Z:'C'},waits:{A:'Y',B:'Z',C:'X'}},blocked:{owners:{X:'A',Y:'B',Z:'C'},waits:{A:'Y',B:'X',C:'X'}},free:{owners:{X:'A',Y:null,Z:'C'},waits:{A:'Y',B:null,C:'X'}}};

function lab(){const r=C.analyze(S.lab.owners,S.lab.waits);return `<p class="eyebrow">WAITING LAB / REASON ABOUT A SYSTEM</p><h1>Change one thing.<br>Follow the consequence.</h1><p class="intro">A wait is not always a deadlock. Build a state, predict whether a closed cycle exists, then inspect the reasoning.</p><div class="note"><b>Model assumptions:</b> one instance per lock; non-reentrant locks; blocking requests; each thread has at most one pending request. Threads keep held locks while blocked. A thread with no blocker can finish and release its locks. This is not a general Banker's-algorithm simulator.</div><label for="preset" class="small"><b>Start with a scenario</b></label>${sel('preset',[['custom','Custom state'],['cycle','Two-thread cycle'],['chain','Waiting chain with an exit'],['three','Three-thread cycle'],['blocked','Cycle plus a blocked dependent'],['free','A free lock lets work continue']],'custom')}<div class="lab-grid" style="margin-top:24px"><div class="lab-controls"><h3>Who holds each lock?</h3><div class="state-row">${['X','Y','Z'].map(x=>`<div><label for="owner-${x}">Lock ${x}</label>${sel('owner-'+x,[['none','Free'],['A','Thread A'],['B','Thread B'],['C','Thread C']],S.lab.owners[x])}</div>`).join('')}</div><h3 style="margin-top:25px">What is each thread waiting for?</h3>${['A','B','C'].map(x=>`<label for="wait-${x}">Thread ${x}</label>${sel('wait-'+x,[['none','Nothing else: can finish'],['X','Lock X'],['Y','Lock Y'],['Z','Lock Z']],S.lab.waits[x])}`).join('')}</div><div class="lab-output"><p class="eyebrow">YOUR PREDICTION</p><p>Does this state contain a closed waiting cycle?</p><div class="actions"><button data-predict="yes" aria-pressed="${S.labPrediction==='yes'}">Yes</button><button data-predict="no" aria-pressed="${S.labPrediction==='no'}">No</button></div><button class="primary" data-action="reveal-lab" ${S.labPrediction===null?'disabled':''}>Trace the state →</button>${S.labRevealed?`<p class="status">${r.cycles.length?'A closed waiting cycle.':'A way through.'}</p><p class="small">${(r.cycles.length>0)===(S.labPrediction==='yes')?'Your prediction matches this model.':'Your prediction needs another look. Follow the actual blockers below.'}</p>${Object.entries(r.edges).map(([t,o])=>`<div class="edge"><code>${t}</code><span class="small">${o?'waits for '+o:'can finish without waiting for another thread'}</span></div>`).join('')}${r.cycles.map(c=>`<p class="small"><b>Closed cycle:</b> ${c.join(' → ')} → ${c[0]}</p>`).join('')}<p class="small">${r.order.length?'Possible completions: '+r.order.join(' → ')+'.':'No thread can complete under these assumptions.'}</p>${r.blocked.length?`<p class="small">Blocked after every possible completion: ${r.blocked.join(', ')}. ${r.blocked.filter(x=>!r.cycleNodes.includes(x)).length?'A dependent may be blocked by a cycle without belonging to it.':''}</p>`:''}<p class="small muted">Try freeing a lock or removing a pending request. The state is re-evaluated, not played back from a canned answer.</p>`:'<p class="small muted" style="margin-top:24px">Make a prediction before seeing the result. This exercise is separate from your self-check scores.</p>'}</div></div><div class="actions">${complete('pre')?'<button data-action="learn">← My learning path</button>':'<button data-action="home">← Learning room</button>'}${complete('pre')?'<button data-action="practice">Continue to practice →</button>':''}</div>`}
function about(){return `<div class="reading"><p class="eyebrow">METHODS / PRIVACY / CREDITS</p><h1>A small claim.<br>A clear trail.</h1><h2>The barrier</h2><p>A university learner can have access to the notes and still get stuck on dense wording. LearnProof pairs original technical passages with plain language, worked examples, a waiting-state model and a path based on missed questions.</p><h2>How the score works</h2><p>The reviewed lesson has three concepts. Six diagnostic items and six different fresh-check items give two questions per concept. Three practice questions are separate. Correct answers count one point; incorrect and "I do not know" count zero. No AI grades an answer.</p><p>Percentage-point change = 100 × (fresh correct / fresh total − starting correct / starting total). Forms follow a topic blueprint but are not statistically equated. We have not run a student efficacy study. Outside help and answer-key inspection are possible.</p><h2>What runs where</h2><p>This learning room is static HTML, CSS and JavaScript. Its lesson, scoring, simulator, report import/export and offline download run in your browser. No analytics, external fonts, tracking scripts, AI API or uploaded PDF processor are in this build. The host may log ordinary page requests. The earlier private Streamlit prototype includes a separate, restricted Groq draft studio; it is not a feature of this public demo.</p><p>Answers stay in session storage by default. Optional local storage keeps them on this device; shared devices should leave it off. Reports are editable local files, not certificates. Import recalculates scores from choices, rather than trusting a report's totals.</p><h2>What's not built</h2><ul class="checklist"><li>No arbitrary PDF-to-lesson generation in this public room, OCR, screen-reader certification or broad course library.</li><li>No proctoring, identity verification, teacher database, automated reminders or verified retention tracking.</li><li>No claim that a six-item score is a stable mastery estimate or that this app causes better learning.</li></ul><h2>Notes & reference reading</h2>${L.pages.map(p=>`<section class="source"><p class="eyebrow">ORIGINAL NOTES / PAGE ${p.page}</p><p>${esc(p.text)}</p></section>`).join('')}<p class="small">The lesson prose, questions and examples are original. Reference: <a target="_blank" rel="noopener noreferrer" href="https://pages.cs.wisc.edu/~remzi/OSFEP/threads-deadlock.pdf">OSTEP: Common Concurrency Problems</a>. Source-page labels refer to the three bundled notes above, not page numbers in that book.</p><h2>Build & authorship</h2><p class="small">M J Anthony directed the project. Implementation, original teaching drafts, tests, interface, documentation and narration were made with AI assistance. A private LearnProof prototype began on 28 October 2026, within AccessED's event window. This v2 rebuild adds targeted revision, the interactive waiting lab, confidence-linked corrections, browser-local evidence restoration and a third recall set. Material is reviewed by the builder, not a subject-matter expert panel.</p><div class="note warn">Use only synthetic or permission-cleared examples. This prototype does not collect learner names or educational records. If you add your own implementation, do not turn a free provider key into an unrestricted public endpoint.</div><div class="actions"><button data-action="home">Back to the learning room</button><button data-action="download-app">Save an offline copy ↓</button></div></div>`}
function render(){if(!need(S.view)){S.view='home'}rail();$('#main').innerHTML=({home,quiz,learn,feedback,report,lab,about,baseline}[S.view]||home)();persist()}

function next(){const q=L[S.stage][S.index];if(!Number.isInteger(S.answers[S.stage][q.id])){$('#error').textContent='Choose an answer or "I do not know" before continuing.';return}if(S.index<L[S.stage].length-1){S.index++;render();$('#main').focus();window.scrollTo(0,0);return}S.done=[...new Set([...S.done,S.stage])];if(S.stage==='pre')S.view='learn';else if(S.stage==='practice')S.view='feedback';else{if(S.stage==='post')S.completedAt=new Date().toISOString();else S.recallCompletedAt=new Date().toISOString();S.view='report'}render();$('#main').focus();window.scrollTo(0,0)}
document.addEventListener('change',async e=>{const t=e.target;if(t.name==='answer'){const q=L[S.stage][S.index];S.answers[S.stage][q.id]=Number(t.value);persist()}else if(t.name==='confidence'){S.confidence[S.stage][L[S.stage][S.index].id]=t.value;persist()}else if(t.dataset.read){S.read=t.checked?[...new Set([...S.read,t.dataset.read])]:S.read.filter(x=>x!==t.dataset.read);persist()}else if(t.id==='remember'){S.remember=t.checked;persist()}else if(t.id==='preset'&&presets[t.value]){S.lab=JSON.parse(JSON.stringify(presets[t.value]));S.labRevealed=false;S.labPrediction=null;render()}else if(t.id.startsWith('owner-')||t.id.startsWith('wait-')){const owner=t.id.startsWith('owner-');S.lab[owner?'owners':'waits'][t.id.split('-')[1]]=t.value==='none'?null:t.value;S.labRevealed=false;S.labPrediction=null;render()}else if(t.id==='import'&&t.files.length){try{const f=t.files[0];if(f.size>100000)throw Error('Report exceeds 100 KB.');const restored=C.restore(L,JSON.parse(await f.text()));S={...defaultState(),...restored,done:['pre','post'],view:'report'};render();toast('Report restored. Scores recalculated from the recorded choices.')}catch(e){toast(e.message)}}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action],[data-nav],[data-predict]');if(!b)return;e.preventDefault();if(b.disabled)return;if(b.dataset.nav){const n=Number(b.dataset.nav);if(n===0)navigate('home');if(n===1){if(complete('pre'))navigate('baseline');else navigate('quiz','pre');}if(n===2)navigate('learn');if(n===3)navigate(complete('practice')?'feedback':'quiz','practice');if(n===4)navigate('quiz','post');if(n===5)navigate('report');return}if(b.dataset.predict){S.labPrediction=b.dataset.predict;render();return}switch(b.dataset.action){case 'home':navigate('home');break;case 'about':case 'sources':navigate('about');break;case 'lab':navigate('lab');break;case 'learn':navigate('learn');break;case 'resume':navigate(complete('post')?'report':complete('practice')?'feedback':'learn');break;case 'start':if(complete('pre')&&!confirm('Start over? Export the existing report first if you want to keep it.'))break;S={...defaultState(),remember:S.remember};navigate('quiz','pre');break;case 'next':next();break;case 'previous':S.index=Math.max(0,S.index-1);render();break;case 'practice':S.done=S.done.filter(x=>x!=='practice');S.answers.practice={};S.confidence.practice={};navigate('quiz','practice');break;case 'post':if(complete('post')&&!confirm('Retake the fresh check? Seeing earlier answers affects interpretation. Existing fresh and recall evidence will be replaced.'))break;S.done=S.done.filter(x=>!['post','recall'].includes(x));S.answers.post={};S.confidence.post={};S.answers.recall={};S.confidence.recall={};S.recallCompletedAt=null;S.completedAt=null;navigate('quiz','post');break;case 'recall':S.done=S.done.filter(x=>x!=='recall');S.answers.recall={};S.confidence.recall={};navigate('quiz','recall');break;case 'reveal-lab':S.labRevealed=true;render();break;case 'export':download('LearnProof-evidence.json',JSON.stringify(C.report(L,S),null,2),'application/json');break;case 'print':window.print();break;case 'download-app':{const clone=document.documentElement.cloneNode(true);clone.querySelector('#main').innerHTML='';clone.querySelector('#rail').innerHTML='';clone.querySelector('#toast').textContent='';download('LearnProof-offline.html','<!doctype html>\n'+clone.outerHTML,'text/html');toast('Offline room saved. Open the HTML file directly in your browser. Session data is not included.');break;}case 'clear':if(confirm('Remove this device’s LearnProof session and any saved answers?')){try{localStorage.removeItem('lp2');sessionStorage.removeItem('lp2')}catch(e){}S=defaultState();render();toast('Local session cleared. Downloaded reports are separate files.')}break;}});
render();
</script></body></html>
